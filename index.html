<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor IPTV</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Reproductor IPTV</h1>
        <input type="text" id="iptv-link" placeholder="Ingresa el enlace de la lista IPTV (m3u/m3u8)">
        <button id="load-channels">Cargar Canales</button>
        
        <!-- Buscador de canales -->
        <input type="text" id="search-channel" placeholder="Buscar canal..." disabled>
        
        <!-- Lista de canales con scroll -->
        <div id="channel-list-container">
            <div id="channel-list"></div>
        </div>
        
        <!-- Reproductor de video -->
        <video id="video-player" controls></video>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
</body>
</html>
